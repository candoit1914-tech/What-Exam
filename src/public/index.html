<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What Exam Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-main">WHAT&nbsp;EXAM</span>
        <span class="brand-sub">DASHBOARD</span>
      </div>
      <div class="topbar-actions">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" placeholder="Search">
        </div>
        <button class="btn btn-dark" onclick="createExam()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          New Exam
        </button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="profile">
          <div class="avatar"><span>WE</span><span class="dot"></span></div>
          <div class="pname">ADMIN</div>
          <div class="prole">WHAT EXAM</div>
          <button class="logout" onclick="location.hash='#/'">LOG OUT</button>
        </div>
        <nav class="nav">
          <div class="nav-group">
            <a href="#/" class="nav-item" data-nav="/">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2.2 4.8L8 16l2.2-4.8L15 9z"/></svg>
              OVERVIEW
            </a>
            <a href="#/exams" class="nav-item" data-nav="/exams">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14a8 8 0 1116 0"/><path d="M12 14l4-4"/><circle cx="12" cy="14" r="1.6" fill="currentColor" stroke="none"/></svg>
              EXAMS
            </a>
            <a href="#/messages" class="nav-item" data-nav="/messages">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              DELIVERY
            </a>
            <a href="#/results" class="nav-item" data-nav="/results">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-6"/><path d="M2 20h20"/></svg>
              RESULTS
            </a>
          </div>
          <div class="nav-group bottom">
            <a href="#/students" class="nav-item" data-nav="/students">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 13.5c2.6.5 5 2.7 5 5.6"/></svg>
              STUDENTS
            </a>
          </div>
        </nav>
      </aside>
      <main class="content" id="view"></main>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
